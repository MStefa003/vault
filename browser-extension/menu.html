<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { background: var(--surface); }
    html { overflow: hidden; }
    body { padding: 6px; border: 1px solid var(--border); border-radius: 10px; min-height: 100vh; }
    .head { display: flex; align-items: center; gap: 6px; padding: 2px 6px 6px; color: var(--faint); font-size: 12px; }
    .head img { width: 14px; height: 14px; }
    .message { padding: 4px 6px; margin: 0; }
    .foot { display: flex; gap: 12px; padding: 4px 6px 0; border-top: 1px solid var(--border); margin-top: 4px; }
    .gen .tile { background: var(--accent-fill); }
  </style>
</head>
<body>
  <div class="head"><img src="icons/icon-16.png" alt=""><span id="head">VaultRust</span></div>
  <main id="main"></main>
  <script type="module" src="menu.js"></script>
</body>
</html>
