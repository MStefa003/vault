<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { background: var(--surface); }
    html { overflow: hidden; }
    body { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; min-height: 100vh; }
    .top { display: flex; align-items: flex-start; gap: 10px; }
    .top img { width: 22px; height: 22px; margin-top: 1px; }
    .text { flex: 1; min-width: 0; }
    .text strong { display: block; }
    .text span { color: var(--dim); overflow-wrap: anywhere; }
    .buttons { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .buttons .link { margin-left: auto; }
    .done { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main id="main"></main>
  <script type="module" src="bar.js"></script>
</body>
</html>
