<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 360px; min-height: 220px; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 0 14px; }
    header img { width: 20px; height: 20px; }
    header .name { font-weight: 600; }
    header .site { margin-left: auto; color: var(--faint); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    nav { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--border); }
    nav button { border: 0; background: none; padding: 6px 10px 8px; border-radius: 6px 6px 0 0; color: var(--dim); border-bottom: 2px solid transparent; }
    nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    main { padding: 10px; }
    .search { display: flex; align-items: center; gap: 6px; padding: 0 8px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; color: var(--faint); }
    .search input { flex: 1; border: 0; padding: 7px 0; background: none; color: var(--text); font: inherit; outline: none; }
    .password { font: 600 16px/1.4 "Cascadia Mono", Consolas, monospace; word-break: break-all; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .note { margin-top: 10px; }
    #toast { position: fixed; left: 10px; right: 10px; bottom: 10px; padding: 8px 12px; border-radius: 7px; background: var(--text); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.on { opacity: .95; }
    .more { margin-top: 8px; }
    .section { margin: 4px 4px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
    .section ~ .section { margin-top: 14px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="">
    <span class="name">VaultRust</span>
    <span id="site" class="site"></span>
    <span id="lock"></span>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="main"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
