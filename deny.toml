# cargo-deny policy for VaultRust.
#
#   cargo deny check
#
# Besides advisories / licences / sources, the [bans] section enforces the
# "no bundled network code" rule: any crate that provides HTTP, TLS, sockets,
# DNS or an async network runtime is rejected if it enters the shipped
# dependency graph. (The update check uses Windows' WinHTTP directly; see
# docs/SECURITY.md.) Dev-only dependencies (test harnesses) are excluded because they are
# never part of the application binary.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
]
exclude-dev = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (not a known vulnerability). It is pulled in by
    # egui's text renderer (epaint -> ab_glyph) with no alternative in egui
    # 0.33. It only parses egui's bundled fonts and local Windows system fonts,
    # never untrusted input. Revisit when upgrading egui.
    { id = "RUSTSEC-2026-0192", reason = "transitive via egui; parses only trusted local fonts" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    # HTTP clients / servers
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "h2" },
    { name = "h3" },
    { name = "ureq" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "minreq" },
    { name = "http-body" },
    { name = "tower" },
    { name = "axum" },
    { name = "actix-web" },
    # TLS
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "schannel" },
    # Sockets, DNS, websockets, QUIC
    { name = "socket2" },
    { name = "mio" },
    { name = "trust-dns-resolver" },
    { name = "hickory-resolver" },
    { name = "tungstenite" },
    { name = "quinn" },
    # Async network runtimes
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    # Telemetry / crash reporting
    { name = "sentry" },
    { name = "opentelemetry" },
    # Self-updaters
    { name = "self_update" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
