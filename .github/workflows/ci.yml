name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows · fmt, clippy, tests, cargo-deny, cargo-audit, network scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      # The same gate developers run locally (see README).
      - name: Audit script
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/audit.ps1
      - name: Release build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1 -KeepCache
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/VaultRust.exe release/VaultRust.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DAppVersion=0.0.0 installer\vaultrust.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: VaultRust-${{ github.sha }}
          path: |
            dist/VaultRust.exe
            release/VaultRust-Setup-0.0.0.exe
          if-no-files-found: error

  headless:
    name: Linux · core library without the GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib --no-default-features -- -D warnings
      - run: cargo test --lib --no-default-features
      - run: cargo test --no-default-features --test credentials_and_backups --test robustness --test vault_integration

  fuzz:
    name: Linux · fuzz smoke test (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run every target
        shell: bash
        run: |
          set -o pipefail
          # On failure, repeat the end of the output as an annotation, which
          # is visible on the run page without opening the log.
          report() { echo "::error title=$1::$(tail -n 40 "$2" | tr -d '\r' | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"; exit 1; }
          cargo fuzz list > targets.txt 2> list.log || report "cargo fuzz list failed" list.log
          for t in $(cat targets.txt); do
            echo "::group::$t"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 -rss_limit_mb=1024 2>&1 | tee "fuzz-$t.log" || report "fuzz target $t failed" "fuzz-$t.log"
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
