[package]
name = "vaultrust"
version = "0.2.3"
edition = "2021"
rust-version = "1.90"
description = "VaultRust - a local password safe"
license = "MIT"
publish = false

[lib]
name = "vaultrust"
path = "src/lib.rs"

[[bin]]
name = "vaultrust"
path = "src/main.rs"
required-features = ["gui"]

# Signs release builds (run by the release workflow; see docs/RELEASING.md).
[[bin]]
name = "vaultrust-sign"
path = "src/bin/sign.rs"
required-features = ["release-tools"]

[features]
default = ["gui"]
release-tools = []
# The desktop front end. Without it the library (crypto, format, storage,
# model, import/export) builds headless, which the fuzz targets rely on.
gui = ["dep:eframe", "dep:rfd", "dep:arboard", "dep:egui-phosphor", "dep:raw-window-handle", "dep:tray-icon", "dep:ab_glyph", "dep:rqrr"]

[dependencies]
# Verifies the signature on downloaded updates (and signs releases).
ed25519-compact = { version = "2.1", default-features = false }
# --- Cryptography -----------------------------------------------------------
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
# Key-file hashing, TOTP (HMAC-SHA1/256/512) and the offline breach check
# (SHA-1 lookups in a Have I Been Pwned list).
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
# Master passwords are NFC-normalised so visually identical input matches.
unicode-normalization = "0.1"

# --- Serialization (vault payload, bounded) ----------------------------------
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# --- Import / export (explicit, user initiated, in memory) -------------------
csv = "1.3"
serde_json = "1"
# KeePass (.kdbx 3.1 / 4.x) import: outer ciphers, inner stream ciphers,
# gzip and XML.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chacha20 = "0.9"
salsa20 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.20"

thiserror = "2"

# --- Desktop UI (native, no webview) -----------------------------------------
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"], optional = true }
rfd = { version = "0.15", default-features = false, optional = true }
arboard = { version = "3.4", default-features = false, optional = true }
# Phosphor icon font (font data only).
egui-phosphor = { version = "0.11", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# Notification-area (system tray) icon and its menu.
tray-icon = { version = "0.21", default-features = false, optional = true }
# Rasterises icon-font glyphs for the tray menu (already used by egui).
ab_glyph = { version = "0.2", optional = true }
# Reads two-step-verification QR codes from a screenshot (src/qr.rs).
rqrr = { version = "0.11", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
# Win32 calls, all in src/os_protect.rs: SetWindowDisplayAffinity (hide the
# window from screen capture), OpenInputDesktop (detect a locked session),
# RegisterHotKey + a message loop (global quick-open shortcut) and
# WerSetFlags / SetErrorMode (keep the heap out of crash reports) and the
# per-user Run registry value (start with Windows), and
# GetUserDefaultUILanguage (the default interface language).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops",
    "Win32_System_ErrorReporting",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_SystemServices",
    "Win32_Security",
] }
# Windows Hello quick unlock (src/hello.rs): a TPM-backed key credential
# signs a fixed challenge after the user's fingerprint, face or PIN.
windows = { version = "0.62", features = [
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    "Foundation",
] }

[build-dependencies]
# Embeds the program icon and version information (build.rs).
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
# Draws QR codes for the scanner tests.
qrcode = { version = "0.14", default-features = false }

# Headless UI tests; the app (and its UI) is Windows-only.
[target.'cfg(windows)'.dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }

[lints.rust]
# Set by cargo-fuzz for the targets in fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# Debug info is what makes `target\` grow into gigabytes. Keep only line
# tables for our own code (enough for panic locations and backtraces) and
# none for dependencies.
[profile.dev]
debug = "line-tables-only"

# Argon2 is unusably slow without optimisation; keep dependencies optimised
# even in debug builds so development unlocks are representative.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
# Optimise for size; the UI is nowhere near CPU-bound.
opt-level = "s"
lto = true
codegen-units = 1
# Unwinding (not abort) so a panic still runs destructors that wipe secrets.
panic = "unwind"
strip = true

# ...except the cryptography, where speed matters: Argon2 time directly
# affects how long unlocking takes.
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
