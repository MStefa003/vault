[package]
name = "vaultrust"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "VaultRust - a strictly local, offline password safe"
license = "MIT"
publish = false

[lib]
name = "vaultrust"
path = "src/lib.rs"

[[bin]]
name = "vaultrust"
path = "src/main.rs"

[dependencies]
# --- Cryptography -----------------------------------------------------------
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"

# --- Serialization (vault payload, bounded) ----------------------------------
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# --- Import / export (explicit, user initiated, in memory) -------------------
csv = "1.3"
serde_json = "1"

thiserror = "2"

# --- Desktop UI (native, no webview) -----------------------------------------
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = { version = "0.15", default-features = false }
arboard = { version = "3.4", default-features = false }
# Phosphor icon font (font data only).
egui-phosphor = "0.11"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Used for exactly one call: SetWindowDisplayAffinity (hide the window from
# screenshots / screen sharing). See src/os_protect.rs.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }
tempfile = "3"

# Debug info is what makes `target\` grow into gigabytes. Keep only line
# tables for our own code (enough for panic locations and backtraces) and
# none for dependencies.
[profile.dev]
debug = "line-tables-only"

# Argon2 is unusably slow without optimisation; keep dependencies optimised
# even in debug builds so development unlocks are representative.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
# Optimise for size; the UI is nowhere near CPU-bound.
opt-level = "s"
lto = true
codegen-units = 1
# Unwinding (not abort) so a panic still runs destructors that wipe secrets.
panic = "unwind"
strip = true

# ...except the cryptography, where speed matters: Argon2 time directly
# affects how long unlocking takes.
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
